<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>About | Hello, world!</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f2ff; --muted:#aaa9c4; --violet:#b49aff; --mint:#9ff3d2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; overflow-x:hidden; padding:6rem 0 4rem; color:var(--ink); background:radial-gradient(ellipse at 18% 20%,#523c91 0,transparent 34%),radial-gradient(ellipse at 82% 78%,#145d68 0,transparent 36%),linear-gradient(135deg,#090d19,#11172b 55%,#0b1020); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body::before { content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E"); }
    .glow { position:fixed;width:22rem;aspect-ratio:1;border-radius:50%;filter:blur(90px);opacity:.2;animation:drift 12s ease-in-out infinite alternate; }
    .one { background:#a279ff;top:-10rem;left:-8rem; }.two { background:#38dfb1;bottom:-13rem;right:-7rem;animation-delay:-5s; }
    nav { position:fixed;z-index:2;top:1.25rem;left:50%;transform:translateX(-50%);display:flex;gap:.35rem;padding:.4rem;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(12,16,32,.62);backdrop-filter:blur(16px); }
    nav a { padding:.65rem 1rem;border-radius:999px;color:var(--muted);text-decoration:none;font-size:.85rem;transition:color .2s,background .2s; }
    nav a:hover,nav a[aria-current="page"] { color:var(--ink);background:rgba(255,255,255,.1); }
    main { position:relative;width:min(90vw,760px);padding:clamp(2.5rem,8vw,5rem) clamp(1.5rem,7vw,5rem);text-align:center;border:1px solid rgba(255,255,255,.15);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));box-shadow:0 30px 100px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(22px);animation:rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display:inline-flex;align-items:center;gap:.55rem;padding:.55rem .9rem;margin-bottom:1.35rem;border:1px solid rgba(180,154,255,.32);border-radius:999px;background:rgba(180,154,255,.1);color:#d9cbff;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase; }
    .spark { color:var(--mint);font-size:.95rem; }
    h1 { margin:0;font-size:clamp(3rem,10vw,6rem);line-height:.98;letter-spacing:-.075em;font-weight:800; }
    h1 span { display:block;color:transparent;background:linear-gradient(100deg,#d6c5ff 12%,#a99aff 48%,#9ff3d2 95%);-webkit-background-clip:text;background-clip:text; }
    p { max-width:35rem;margin:1.5rem auto 0;color:var(--muted);font-size:clamp(1rem,2.5vw,1.12rem);line-height:1.8; }
    .rule { width:3.2rem;height:2px;margin:2rem auto 0;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--mint)); }
    footer { position:fixed;bottom:1.4rem;color:rgba(220,220,240,.48);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase; }
    @keyframes rise { from { opacity:0;transform:translateY(20px) scale(.985); }to { opacity:1;transform:translateY(0) scale(1); } }
    @keyframes drift { to { transform:translate(3rem,2rem) scale(1.15); } }
    @media (max-width:420px) { nav { width:max-content;max-width:94vw; } nav a { padding:.6rem .8rem;font-size:.8rem; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div><div class="glow two" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="spark">✦</span> The story behind the page</div>
    <h1>A little<span>about us</span></h1>
    <p>This small corner of the web began with a simple idea: make something welcoming, thoughtful, and a little bit magical. We believe the best things start with curiosity—and grow one good idea at a time.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html" aria-current="page">About</a><a href="contact.html">Contact</a></nav>
  <footer>Made with a little ✦</footer>
</body>
</html>
